# Examples of the cbor gem's specs that fail against Ciborium::Compat, by full description, with the
# deviation that makes each fail. Keyed by CIBORIUM_UPSTREAM_EXTENSIONS.
default:
  "CBOR Time": "tag 1 decodes to Tagged unless the time extension is allowlisted"
  "CBOR URI": "tag 32 decodes to Tagged unless the uri extension is allowlisted"
  "CBOR regexp": "tag 35 decodes to Tagged unless the regexp extension is allowlisted"
  "CBOR very simple bignums": "integers outside -2**64...2**64 need the bignum extension allowlisted"
  "CBOR 0x982173487123985791827359872948752345": "integers outside -2**64...2**64 need the bignum extension allowlisted"
  "CBOR fixnum/bignum switch": "integers outside -2**64...2**64 need the bignum extension allowlisted"
all:
  "CBOR Unknown tag 0": "the time extension decodes tag 0 and rejects content other than text"
