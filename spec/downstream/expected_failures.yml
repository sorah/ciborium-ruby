# Examples of downstream suites that fail against Ciborium::Compat, by full description, with the
# reason each fails. Keyed by CIBORIUM_DOWNSTREAM_SUITE, then CIBORIUM_DOWNSTREAM_EXTENSIONS.
webauthn:
  default: &webauthn
    "WebAuthn::AuthenticatorAttestationResponse when apple attestation returns attestation info": "fails with the cbor gem as well at webauthn-ruby v3.5.0"
    "WebAuthn::AuthenticatorAttestationResponse when apple attestation behaves like a valid attestation response verifies": "fails with the cbor gem as well at webauthn-ruby v3.5.0"
    "WebAuthn::AuthenticatorAttestationResponse when apple attestation behaves like a valid attestation response is valid": "fails with the cbor gem as well at webauthn-ruby v3.5.0"
  none: *webauthn
