name: Test

# The checks rake, rake spec:upstream, rake steep and hk check run locally. No secrets required.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  spec:
    name: "rspec (Ruby ${{ matrix.ruby }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The gemspec supports >= 3.3, and precompiled gems carry 3.3 to 4.0.
      matrix:
        os: [ubuntu-24.04]
        ruby: ['3.3', '3.4', '4.0']
        include:
          - os: macos-15
            ruby: '4.0'
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: bundle exec rake compile
      - run: bundle exec rake spec
      - run: bundle exec rake spec:upstream

  # Installs the source gem the way a user without a precompiled gem would.
  source-gem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: mkdir -p tmp && gem build ciborium.gemspec --output tmp/ciborium.gem
      - run: gem install --no-document tmp/ciborium.gem # zizmor: ignore[adhoc-packages]
      - name: Smoke test the installed gem
        run: ruby -e 'require "ciborium"; v = {"a" => [1, 2.5, nil]}; abort "round trip failed" unless Ciborium.decode(Ciborium.encode(v)) == v'

  steep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .gem_rbs_collection
          key: rbs-collection-${{ hashFiles('rbs_collection.lock.yaml') }}
          restore-keys: rbs-collection-
      - run: bundle exec rbs collection install --frozen
      - name: Check sig/generated is current
        run: |
          bundle exec rake rbs
          git diff --exit-code sig/generated
      - run: bundle exec steep check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Ruby comes from setup-ruby, which also caches the bundle.
      MISE_DISABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # steep runs in its own job, which prepares the rbs collection it needs.
      - run: hk check --all --skip-step steep
