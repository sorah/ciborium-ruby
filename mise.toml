[tools]
ruby = "4.0.9"
rust = { version = "1.99.1", components = "rustfmt,clippy" }
"aqua:jdx/hk" = "2.8.1"
"aqua:apple/pkl" = "0.32.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.31.1"

[settings]
disable_backends = ["asdf"]

[settings.ruby]
compile = false

[tasks.pre-commit]
run = "hk run pre-commit"

[tasks.setup]
run = "bin/setup"
